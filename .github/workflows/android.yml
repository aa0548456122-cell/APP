name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download higher accuracy offline Hebrew and English OCR models
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -fL --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/heb.traineddata -o app/src/main/assets/tessdata/heb.traineddata
          curl -fL --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/eng.traineddata -o app/src/main/assets/tessdata/eng.traineddata
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShoppingOffline-v1.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
